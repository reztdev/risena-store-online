<footer>RISENA · HANDMADE DI INDONESIA</footer>
<div class="bn"><button data-g="home" id="b-home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg>Beranda</button><button data-g="shop" id="b-shop"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</button><button data-cart><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/><path d="M3 4h2.5l2 11h10l2-8H6.5"/></svg>Keranjang<em id="cn2">0</em></button></div>
